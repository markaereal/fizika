<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Svyravimų užrašai</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an operations console. Near-black room, panels one tone lighter, one cold monitor-blue accent. The knowledge graph is the main screen; notes open as readouts beside it. Phones get a bottom control bar. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#05070a; --panel:#0b0f15; --panel-2:#111720; --panel-3:#18202b; --line:#1e2733;
  --ink:#dbe2ea; --ink-2:#8a97a8; --ink-3:#5d6979;
  --sig:#56c4ff; --sig-dim:rgba(86,196,255,.13); --sig-line:rgba(86,196,255,.32);
  --warn:#e3b45a; --warn-dim:rgba(227,180,90,.10);
  --g-apzvalga:#56c4ff; --g-savokos:#8ea3ba; --g-svyruokles:#d2a65a; --g-lygtys:#e2605f; --g-uzdaviniai:#71c495; --g-matematika:#a596d8;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --tabbar:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
::selection{background:var(--sig);color:var(--bg)}
:focus-visible{outline:1.5px solid var(--sig);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;touch-action:manipulation}
*{scrollbar-color:var(--panel-3) transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.04em}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-left:var(--gut-l);padding-right:var(--gut-r)}
.bar-in{display:flex;align-items:center;gap:16px;height:56px;max-width:1440px;margin:0 auto;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:baseline;gap:12px;color:var(--ink);text-decoration:none;margin-right:auto;min-width:0}
.mark b{font:600 1.35rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.mark .mono{color:var(--ink-3);white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:2px;color:var(--ink-2);text-decoration:none;font:500 .78rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform 140ms var(--ease-out),color 140ms ease,border-color 140ms ease}
.tbtn:active{transform:scale(.97)}
.tbtn.on{color:var(--sig);border-color:var(--sig-line);background:var(--sig-dim)}
@media (hover:hover) and (pointer:fine){.tbtn:hover{color:var(--ink);border-color:var(--ink-3)}}

/* frame */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:20px 56px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100dvh - 96px);overflow:auto;overscroll-behavior:contain}
.side nav{display:flex;flex-direction:column;gap:22px}
.grp h2{font:500 .72rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px 12px}
.grp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px;color:var(--ink-2);text-decoration:none;font-size:.95rem;line-height:1.3;transition:color 140ms ease,background-color 140ms ease}
.item .dot{width:6px;height:6px;flex:none;background:var(--c);border-radius:50%;opacity:.85}
.item[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
.item[aria-current="page"]::after{content:"";position:absolute;right:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--sig)}
@media (hover:hover) and (pointer:fine){.item:hover{color:var(--ink)}}
.sheet-head{display:none}

main{min-width:0}
.view{animation:viewIn 240ms var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* home */
.home h1{font:600 clamp(2.4rem,5.4vw,4.6rem)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 14px;text-wrap:balance}
.home .lede{font-size:1.08rem;color:var(--ink-2);max-width:58ch;margin:0 0 24px}
.screen{position:relative;background:var(--panel);border:1px solid var(--line);height:min(70vh,700px);min-height:440px;overflow:hidden;touch-action:none;
  background-image:radial-gradient(circle at 50% 45%,rgba(86,196,255,.06),transparent 60%),radial-gradient(var(--panel-3) 1px,transparent 1.2px);background-size:auto,22px 22px}
.screen svg{display:block;width:100%;height:100%;cursor:grab}
.screen svg:active{cursor:grabbing}
.readout{position:absolute;left:14px;top:12px;display:flex;gap:16px;color:var(--ink-3);pointer-events:none}
.readout b{color:var(--ink-2);font-weight:500}
.zoomctl{position:absolute;right:12px;top:10px;display:flex;gap:6px}
.zoomctl button{width:32px;height:32px;padding:0;justify-content:center}
.lnk{stroke:var(--ink-3);stroke-opacity:.38;stroke-width:.8;transition:stroke-opacity 180ms ease,stroke 180ms ease}
.lnk.hi{stroke:var(--sig);stroke-opacity:.95;stroke-width:1.3}
.nd{cursor:pointer;outline:none}
.nd:focus-visible .core{stroke:var(--sig);stroke-width:2.4}
.nd .halo{fill:var(--c);opacity:.12;transition:opacity 180ms ease}
.nd .core{fill:var(--bg);stroke:var(--c);stroke-width:1.6}
.nd .pip{fill:var(--c)}
.nd text{fill:var(--ink-2);font-family:var(--f-mono);letter-spacing:.02em;paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;transition:opacity 180ms ease,fill 180ms ease}
.nd.sel .halo,.nd.near .halo{opacity:.3}
.nd.sel text{fill:var(--sig)}
.nd.sel .core{stroke:var(--sig);stroke-width:2;filter:drop-shadow(0 0 5px var(--sig))}
.focus .nd.dim{opacity:.16}
.focus .lnk:not(.hi){stroke-opacity:.06}
.far .nd:not(.hub):not(.sel):not(.near) text{opacity:0}
.nd .tgt{fill:transparent}
.gcard{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;background:var(--panel-2);border:1px solid var(--sig-line);transform:translateY(calc(100% + 16px));opacity:0;transition:transform 260ms var(--ease-drawer),opacity 200ms ease;pointer-events:none}
.gcard.show{transform:none;opacity:1;pointer-events:auto}
.gcard .gc-t{flex:1;min-width:0}
.gcard .gc-k{color:var(--ink-3);display:block;margin-bottom:2px}
.gcard .gc-n{font:600 1.2rem/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.open{display:inline-flex;align-items:center;height:40px;padding:0 16px;background:var(--sig);color:var(--bg);text-decoration:none;font:500 .8rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:transform 140ms var(--ease-out)}
.open:active{transform:scale(.97)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:8px}
.legend .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c)}
.hint{color:var(--ink-3);margin:10px 0 0}

/* note */
.note{max-width:72ch}
.crumb{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--ink-3);margin:0 0 14px}
.crumb .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:7px}
.note h1{font:600 clamp(2rem,4.4vw,3.3rem)/.98 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 24px;text-wrap:balance}
.note h1 mjx-container{text-transform:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.body{font-size:1.06rem;line-height:1.65;color:var(--ink)}
.body h2{font:600 1.55rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:2.2em 0 .6em;text-wrap:balance;color:var(--ink)}
.body p,.body ul,.body ol{margin:0 0 1em}
.body li{margin:.25em 0}
.body ul{padding-left:1.2em}
.body li::marker{color:var(--ink-3)}
.body strong{color:#fff;font-weight:600}
.body a.wl{color:var(--sig);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:var(--sig-line)}
@media (hover:hover) and (pointer:fine){.body a.wl:hover{text-decoration-color:var(--sig)}}
.body blockquote{margin:0 0 1.2em;padding:16px 18px;background:var(--sig-dim);border:1px solid var(--sig-line);font-weight:500}
.body blockquote p:last-child{margin:0}
.mathd{overflow-x:auto;overflow-y:hidden;margin:.6em 0 1.2em;padding:14px 16px;background:var(--panel);border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tw{overflow-x:auto;margin:0 0 1.3em;border:1px solid var(--line)}
.body table{border-collapse:collapse;font-size:.96rem;font-variant-numeric:tabular-nums;min-width:100%}
.body th{background:var(--panel-2);text-align:left;font:500 .74rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.body th,.body td{padding:10px 14px;vertical-align:top}
.body tr+tr td{border-top:1px solid var(--line)}
.photo{margin:0 0 20px;border:1px solid var(--line)}
.photo img{display:block;width:100%;filter:grayscale(.35) contrast(1.05) brightness(.9)}
mjx-container{color:var(--ink)}
mjx-container[display="true"]{margin:0!important}

/* callouts */
.co{margin:0 0 12px}
aside.co{background:var(--panel);border:1px solid var(--line);padding:14px 18px}
aside.co-warning{background:var(--warn-dim);border-color:rgba(227,180,90,.35)}
.co-k{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sig);margin:0 0 6px}
aside.co-warning .co-k{color:var(--warn)}
aside .co-t{font-weight:600;margin:0 0 6px}
.co-b>:last-child{margin-bottom:0}
details.co{background:var(--panel);border:1px solid var(--line);transition:border-color 160ms ease}
details.co[open]{border-color:var(--sig-line)}
details.co summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 16px 14px 18px;align-items:center;min-height:52px}
details.co summary::-webkit-details-marker{display:none}
details.co summary .co-k{grid-column:1}
details.co summary .co-t{grid-column:1;font-weight:500}
details.co summary::after{content:"Rodyti";grid-column:2;grid-row:1 / span 2;font:500 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sig);padding:9px 10px;border:1px solid var(--sig-line);white-space:nowrap}
details.co[open] summary::after{content:"Slėpti";color:var(--ink-2);border-color:var(--line)}
details.co .co-b{padding:2px 18px 16px;border-top:1px dashed var(--line);padding-top:14px}
details.co[open] .co-b{animation:reveal 220ms var(--ease-out)}
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.back{margin-top:44px}
.back h2{font:500 .74rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips a{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:0 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);text-decoration:none;font-size:.93rem;transition:transform 140ms var(--ease-out),color 140ms ease,border-color 140ms ease}
.chips a:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.chips a:hover{color:var(--ink);border-color:var(--ink-3)}}
.chips .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.pn a{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font:600 1.05rem/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em;transition:transform 140ms var(--ease-out),border-color 140ms ease}
.pn a:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.pn a:hover{border-color:var(--sig-line)}}
.pn a small{font:500 .7rem/1 var(--f-mono);letter-spacing:.1em;color:var(--ink-3)}
.pn a.nx{grid-column:2;text-align:right;align-items:flex-end}
.foot{max-width:1440px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 32px;color:var(--ink-3);font-size:.85rem}
.foot p{max-width:70ch;margin:0}

/* phone */
.tabbar,.scrim{display:none}
@media (max-width:860px){
  :root{--tabbar:64px}
  .bar-in{height:52px}
  .mark .mono,.bar .tbtn{display:none}
  .app{grid-template-columns:minmax(0,1fr);gap:0;padding-block:16px calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 24px)}
  .side{position:fixed;z-index:45;left:0;right:0;bottom:0;top:auto;max-height:78dvh;background:var(--panel);border-top:1px solid var(--sig-line);padding:0 var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 20px) var(--gut-l);transform:translateY(102%);transition:transform 300ms var(--ease-drawer);visibility:hidden;overflow:auto}
  .side.open{transform:none;visibility:visible}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--panel);padding:14px 0 12px;margin-bottom:6px;z-index:1}
  .sheet-head span{color:var(--ink-3)}
  .item{min-height:46px;font-size:1rem}
  .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity 240ms ease}
  .scrim.open{opacity:1;pointer-events:auto}
  .tabbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;z-index:35;left:0;right:0;bottom:0;padding:10px var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 10px) var(--gut-l);background:var(--bg);border-top:1px solid var(--line)}
  .tabbar .tbtn{height:44px;justify-content:center;font-size:.8rem}
  .home h1{font-size:2.6rem}
  .readout .rz{display:none}
  .gcard{position:fixed;z-index:36;left:var(--gut-l);right:var(--gut-r);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 10px)}
  .gcard:not(.show){visibility:hidden}
  .home .lede{font-size:1rem;margin-bottom:16px}
  .screen{margin-left:calc(var(--gut-l) * -1);margin-right:calc(var(--gut-r) * -1);border-left:0;border-right:0;height:calc(100dvh - 52px - var(--tabbar) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 40px);min-height:420px;max-height:720px}
  .note h1{font-size:2.2rem;margin-bottom:20px}
  .body{font-size:1.02rem;line-height:1.62}
  .body h2{font-size:1.35rem}
  .mathd{margin-left:calc(var(--gut-l) * -1);margin-right:calc(var(--gut-r) * -1);border-left:0;border-right:0;padding:12px var(--gut-r) 12px var(--gut-l)}
  .tw{margin-left:calc(var(--gut-l) * -1);margin-right:calc(var(--gut-r) * -1);border-left:0;border-right:0}
  .body table{font-size:.9rem}
  .body th,.body td{padding:9px 10px}
  .body th:first-child,.body td:first-child{padding-left:var(--gut-l)}
  details.co summary{padding:12px 12px 12px 14px}
  details.co .co-b{padding:12px 14px 14px}
  aside.co{padding:12px 14px}
  .pn a{padding:12px;font-size:.98rem}
  .foot{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px)}
}
@media (prefers-reduced-motion:reduce){
  .view,details.co[open] .co-b{animation:fadeOnly 160ms ease}
  @keyframes fadeOnly{from{opacity:0}to{opacity:1}}
  .side,.gcard{transition:opacity 160ms ease}
  .tbtn,.chips a,.pn a,.open{transition:none}
}
</style>

</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="mark" href="#grafas"><b>Svyravimų užrašai</b><span class="mono" id="stats"></span></a>
  <button class="tbtn" id="menuBtn" type="button" aria-controls="side" aria-expanded="false" hidden>Užrašai</button>
  <a class="tbtn" id="graphBtn" href="#grafas">Grafas</a>
</div></header>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Užrašų sąrašas">
    <div class="sheet-head"><span class="mono">Visi užrašai</span><button class="tbtn" type="button" id="closeSheet">Uždaryti</button></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="foot"><p>Sudaryta iš rankraštinių pamokos užrašų ir vadovėlio „Fizika 11“ 8.1–8.3 skyrių. Dalys, pažymėtos „Papildyta“, užrašuose nebuvo.</p></div>
<nav class="tabbar" aria-label="Valdymas">
  <a class="tbtn" id="tabGraph" href="#grafas">Grafas</a>
  <button class="tbtn" id="tabNotes" type="button" aria-controls="side" aria-expanded="false">Užrašai</button>
</nav>

</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>

<script>
const NOTES=[{"id": "mechaniniai-svyravimai", "name": "Mechaniniai svyravimai", "title": "Mechaniniai svyravimai", "html": "<p>Temos apžvalga. Vadovėlis: <em>Fizika 11<\/em>, 8 skyrius (8.1–8.3).<\/p>\n<h2>8.1 Mechaninis svyravimas ir jo rūšys<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#mechaninis-svyravimas\">Mechaninis svyravimas<\/a>: kas tai, periodinis judesys<\/li>\n<li><a class=\"wl\" href=\"#pusiausvyros-padetis\">Pusiausvyros padėtis<\/a><\/li>\n<li><a class=\"wl\" href=\"#laisvasis-ir-priverstinis-svyravimas\">Laisvasis ir priverstinis svyravimas<\/a>: vidinės ir išorinės jėgos<\/li>\n<li><a class=\"wl\" href=\"#laisvojo-svyravimo-salygos\">Laisvojo svyravimo sąlygos<\/a><\/li>\n<li><a class=\"wl\" href=\"#spyruokline-svyruokle\">Spyruoklinė svyruoklė<\/a><\/li>\n<li><a class=\"wl\" href=\"#matematine-svyruokle\">Matematinė svyruoklė<\/a><\/li>\n<\/ul>\n<h2>Svyravimą apibūdinantys dydžiai<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#amplitude\">Amplitudė<\/a>: \\(x_m\\)<\/li>\n<li><a class=\"wl\" href=\"#periodas-ir-daznis\">Periodas ir dažnis<\/a>: \\(T\\), \\(\\nu\\) (arba \\(f\\))<\/li>\n<li><a class=\"wl\" href=\"#ciklinis-daznis\">Ciklinis dažnis<\/a>: \\(\\omega\\)<\/li>\n<\/ul>\n<h2>8.2 Svyravimo lygtis. Grafinis vaizdavimas<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#harmoninis-svyravimas\">Harmoninis svyravimas<\/a>: geometrinis modelis, grafikai<\/li>\n<li><a class=\"wl\" href=\"#judejimo-lygtis\">Judėjimo lygtis<\/a>: \\(x = x_m \\sin \\omega t\\)<\/li>\n<\/ul>\n<h2>8.3 Fazė, greitis ir pagreitis<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#svyravimo-faze\">Svyravimo fazė<\/a>: \\(\\varphi = \\frac{2\\pi}{T}t\\)<\/li>\n<li><a class=\"wl\" href=\"#greicio-lygtis\">Greičio lygtis<\/a>: \\(v = x&#x27;\\)<\/li>\n<li><a class=\"wl\" href=\"#pagreicio-lygtis\">Pagreičio lygtis<\/a>: \\(a = v&#x27;\\)<\/li>\n<li><a class=\"wl\" href=\"#jegos-lygtis\">Jėgos lygtis<\/a>: \\(F = ma\\)<\/li>\n<\/ul>\n<p>Kiekviena lygtis gaunama iš ankstesnės imant <a class=\"wl\" href=\"#isvestine\">išvestinę<\/a>.<\/p>\n<h2>Uždaviniai<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#uzdavinys-1-svyruokle-t-0-05-s\">Uždavinys 1 – svyruoklė (T = 0,05 s)<\/a> (iš pamokos)<\/li>\n<li><a class=\"wl\" href=\"#vadovelio-uzdaviniai-8-1-8-2\">Vadovėlio uždaviniai (8.1–8.2)<\/a><\/li>\n<\/ul>\n<h2>Originalūs užrašai<\/h2>\n<figure class=\"photo\"><img src=\"svyravimai-1.jpg\" alt=\"Užrašų nuotrauka: svyravimai-1.jpg\" loading=\"lazy\"><\/figure>\n<figure class=\"photo\"><img src=\"svyravimai-2.jpg\" alt=\"Užrašų nuotrauka: svyravimai-2.jpg\" loading=\"lazy\"><\/figure>", "group": "apzvalga", "folder": "Mechaniniai svyravimai", "links": ["amplitude", "ciklinis-daznis", "greicio-lygtis", "harmoninis-svyravimas", "isvestine", "jegos-lygtis", "judejimo-lygtis", "laisvasis-ir-priverstinis-svyravimas", "laisvojo-svyravimo-salygos", "matematine-svyruokle", "mechaninis-svyravimas", "pagreicio-lygtis", "periodas-ir-daznis", "pusiausvyros-padetis", "spyruokline-svyruokle", "svyravimo-faze", "uzdavinys-1-svyruokle-t-0-05-s", "vadovelio-uzdaviniai-8-1-8-2"], "q": 0}, {"id": "mechaninis-svyravimas", "name": "Mechaninis svyravimas", "title": "Mechaninis svyravimas", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.1.<\/p>\n<h2>Apibrėžimas<\/h2>\n<p><strong>Mechaninis svyravimas<\/strong> yra kūno judėjimas pirmyn ir atgal apie <a class=\"wl\" href=\"#pusiausvyros-padetis\">pusiausvyros padėtį<\/a>, kuris periodiškai kartojasi ta pačia trajektorija.<\/p>\n<p><strong>Periodinis judesys<\/strong> yra tiksliai pasikartojantis judesys. Pagrindinis svyravimo požymis yra <strong>periodiškumas<\/strong>.<\/p>\n<p>Palyginimas:\n- Tiesiai važiuojantis vežimėlis kiekvieną akimirką būna vis kitoje vietoje, ir padėtis nesikartoja. Tai <strong>ne<\/strong> svyravimas.\n- Ant siūlo kabantis rutuliukas nuskrieja iš dešiniosios kraštinės padėties į kairiąją ir grįžta atgal, o tada kartoja tą patį judesį. Tai svyravimas.<\/p>\n<h2>Pagrindinis teiginys (iš pamokos)<\/h2>\n<blockquote>\n<p>Jeigu gamtoje koks nors fizikinis dydis kinta periodiškai, tai jis kinta pagal <strong>sinuso arba kosinuso dėsnį<\/strong>.<\/p>\n<\/blockquote>\n<p>Toks svyravimas vadinamas <a class=\"wl\" href=\"#harmoninis-svyravimas\">harmoniniu<\/a>.<\/p>\n<h2>Rūšys<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#laisvasis-ir-priverstinis-svyravimas\">Laisvasis ir priverstinis svyravimas<\/a><\/li>\n<\/ul>\n<h2>Apibūdinantys dydžiai<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#amplitude\">Amplitudė<\/a><\/li>\n<li><a class=\"wl\" href=\"#periodas-ir-daznis\">Periodas ir dažnis<\/a><\/li>\n<li><a class=\"wl\" href=\"#ciklinis-daznis\">Ciklinis dažnis<\/a><\/li>\n<li><a class=\"wl\" href=\"#svyravimo-faze\">Svyravimo fazė<\/a><\/li>\n<\/ul>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kas yra mechaninis svyravimas?<\/span><\/summary><div class=\"co-b\"><p>Kūno judėjimas apie pusiausvyros padėtį, kuris periodiškai kartojasi ta pačia trajektorija.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: koks yra pagrindinis svyravimo požymis?<\/span><\/summary><div class=\"co-b\"><p>Periodiškumas: judesys kartojasi.<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["amplitude", "ciklinis-daznis", "harmoninis-svyravimas", "laisvasis-ir-priverstinis-svyravimas", "mechaniniai-svyravimai", "periodas-ir-daznis", "pusiausvyros-padetis", "svyravimo-faze"], "q": 2}, {"id": "pusiausvyros-padetis", "name": "Pusiausvyros padėtis", "title": "Pusiausvyros padėtis", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>.<\/p>\n<p>Tai padėtis, kurioje kūną veikiančių jėgų atstojamoji lygi nuliui. Ašyje ji žymima \\(x = 0\\).<\/p>\n<p>Pavyzdžiui, <a class=\"wl\" href=\"#matematine-svyruokle\">matematinės svyruoklės<\/a> rutuliukas ramiai kabantis žemiausiame taške:<\/p>\n<div class=\"mathd\">\\[\\vec{mg} + \\vec{F_T} = 0\\]<\/div>\n<ul>\n<li>\\(\\vec{F_T}\\): siūlo įtempimo jėga (į viršų)<\/li>\n<li>\\(\\vec{mg}\\): sunkio jėga (žemyn)<\/li>\n<\/ul>\n<p>Pusiausvyros padėtyje:\n- greitis <strong>didžiausias<\/strong>: \\(v = v_m\\)\n- jėga ir pagreitis <strong>lygūs nuliui<\/strong><\/p>\n<p>Kraštinėse padėtyse (\\(x = \\pm x_m\\), žr. <a class=\"wl\" href=\"#amplitude\">Amplitudė<\/a>) yra atvirkščiai: \\(v = 0\\), o jėga ir pagreitis didžiausi.<\/p>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kur svyruoklės greitis didžiausias, o kur lygus nuliui?<\/span><\/summary><div class=\"co-b\"><p>Didžiausias pusiausvyros padėtyje (\\(x=0\\)), lygus nuliui kraštinėse padėtyse (\\(x = \\pm x_m\\)).<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["amplitude", "matematine-svyruokle", "mechaniniai-svyravimai"], "q": 1}, {"id": "laisvasis-ir-priverstinis-svyravimas", "name": "Laisvasis ir priverstinis svyravimas", "title": "Laisvasis ir priverstinis svyravimas", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.1.<\/p>\n<h2>Sistema ir jėgos<\/h2>\n<p>Tarpusavyje susiję kūnai sudaro <strong>sistemą<\/strong>. Pavyzdžiai: siūlas ir rutuliukas, sūpuoklės ir vaikas.\n- <strong>Vidinės jėgos<\/strong> veikia tik tarp sistemos kūnų.\n- <strong>Išorinės jėgos<\/strong> veikia sistemos kūnus iš kitų kūnų, kurie sistemai nepriklauso.<\/p>\n<h2>Laisvasis svyravimas<\/h2>\n<p>Jį sukelia sistemą veikiančios <strong>vidinės<\/strong> jėgos. Kūną užtenka vieną kartą išvesti iš pusiausvyros.\n- Pavyzdžiai: <a class=\"wl\" href=\"#matematine-svyruokle\">Matematinė svyruoklė<\/a>, <a class=\"wl\" href=\"#spyruokline-svyruokle\">Spyruoklinė svyruoklė<\/a>\n- Kada jis įmanomas: <a class=\"wl\" href=\"#laisvojo-svyravimo-salygos\">Laisvojo svyravimo sąlygos<\/a><\/p>\n<h2>Priverstinis svyravimas<\/h2>\n<p>Jį sukelia <strong>periodiškai kintanti išorinė<\/strong> jėga.\n- Pavyzdžiai: stūmoklis variklio cilindre, siuvimo mašinos adata, nuolat stumiamos sūpuoklės.<\/p>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kuo skiriasi laisvasis ir priverstinis svyravimas?<\/span><\/summary><div class=\"co-b\"><p>Laisvąjį sukelia vidinės sistemos jėgos, o priverstinį – periodiškai kintanti išorinė jėga.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: ar sūpuoklės, kurias kas nors nuolat stumia, svyruoja laisvai?<\/span><\/summary><div class=\"co-b\"><p>Ne, tai priverstinis svyravimas, nes jį palaiko periodiškai veikianti išorinė jėga (stūmimas).<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["laisvojo-svyravimo-salygos", "matematine-svyruokle", "mechaniniai-svyravimai", "spyruokline-svyruokle"], "q": 2}, {"id": "laisvojo-svyravimo-salygos", "name": "Laisvojo svyravimo sąlygos", "title": "Laisvojo svyravimo sąlygos", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.1. Taikoma <a class=\"wl\" href=\"#laisvasis-ir-priverstinis-svyravimas\">laisvajam svyravimui<\/a>.<\/p>\n<p>Kad kūnas svyruotų laisvai, reikia:<\/p>\n<ol>\n<li><strong>Grąžinančios jėgos.<\/strong> Išvedus kūną iš <a class=\"wl\" href=\"#pusiausvyros-padetis\">pusiausvyros padėties<\/a>, turi atsirasti kintama jėga, nukreipta į pusiausvyros padėtį.<\/li>\n<li><a class=\"wl\" href=\"#spyruokline-svyruokle\">Spyruoklinė svyruoklė<\/a>: tamprumo jėga \\(\\vec{F_t}\\)<\/li>\n<li><a class=\"wl\" href=\"#matematine-svyruokle\">Matematinė svyruoklė<\/a>: \\(\\vec{F_s}\\) ir \\(\\vec{F_t}\\) atstojamoji \\(\\vec{F}\\)<\/li>\n<li><strong>Inercijos.<\/strong> Pusiausvyros padėtyje jėga lygi 0, bet kūnas nesustoja ir iš inercijos juda toliau. Jei sustotų, svyravimas nutrūktų.<\/li>\n<li><strong>Mažos trinties.<\/strong> Jei rutuliuką panardinsime į klampų skystį, jis grįš į pusiausvyrą, bet dėl trinties ten sustos, ir svyravimas užsibaigs.<\/li>\n<\/ol>\n<aside class=\"co co-tip\"><p class=\"co-k\">Trumpai<\/p><p class=\"co-t\">Trumpai<\/p><div class=\"co-b\"><p>Svyravimo priežastis = <strong>jėga, nukreipta į pusiausvyrą<\/strong> + <strong>inercija<\/strong>, kai <strong>trintis maža<\/strong>.<\/p><\/div><\/aside>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kokios trys laisvojo svyravimo sąlygos?<\/span><\/summary><div class=\"co-b\"><p>1) Išvedus iš pusiausvyros, atsiranda jėga, nukreipta į pusiausvyros padėtį; 2) kūno inercija; 3) maža trintis.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kodėl svyruoklė nesustoja pusiausvyros padėtyje, nors ten jėga lygi 0?<\/span><\/summary><div class=\"co-b\"><p>Dėl inercijos: ji ten turi didžiausią greitį ir juda toliau.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kodėl svyruoklė klampiame skystyje nesvyruoja?<\/span><\/summary><div class=\"co-b\"><p>Dėl didelės trinties: grįžus į pusiausvyros padėtį jos greitis lygus 0.<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["laisvasis-ir-priverstinis-svyravimas", "matematine-svyruokle", "mechaniniai-svyravimai", "pusiausvyros-padetis", "spyruokline-svyruokle"], "q": 3}, {"id": "amplitude", "name": "Amplitudė", "title": "Amplitudė", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>.<\/p>\n<p><strong>Amplitudė<\/strong> yra didžiausias fizikinio dydžio nukrypimas nuo <a class=\"wl\" href=\"#pusiausvyros-padetis\">pusiausvyros<\/a> vertės.<\/p>\n<ul>\n<li>\\(x_m\\): svyravimų amplitudė (poslinkio)<\/li>\n<li>Vienetas: <strong>m<\/strong><\/li>\n<\/ul>\n<p>Kūnas svyruoja tarp \\(x = -x_m\\) ir \\(x = x_m\\).<\/p>\n<p>Panašiai žymimos ir kitų dydžių didžiausios vertės:\n- \\(v_m = x_m \\omega\\): greičio amplitudė (žr. <a class=\"wl\" href=\"#greicio-lygtis\">Greičio lygtis<\/a>)\n- \\(a_m = x_m \\omega^2\\): pagreičio amplitudė (žr. <a class=\"wl\" href=\"#pagreicio-lygtis\">Pagreičio lygtis<\/a>)<\/p>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kas yra amplitudė?<\/span><\/summary><div class=\"co-b\"><p>Didžiausias fizikinio dydžio nukrypimas nuo pusiausvyros vertės.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: per vieną periodą kūnas nueina kokį kelią, jei amplitudė \\(x_m\\)?<\/span><\/summary><div class=\"co-b\"><p>\\(4x_m\\) (iš pusiausvyros į kraštą, atgal, į kitą kraštą ir atgal).<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["greicio-lygtis", "mechaniniai-svyravimai", "pagreicio-lygtis", "pusiausvyros-padetis"], "q": 2}, {"id": "periodas-ir-daznis", "name": "Periodas ir dažnis", "title": "Periodas ir dažnis", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.1.<\/p>\n<h2>Periodas \\(T\\)<\/h2>\n<p>Laiko tarpas, per kurį kūnas susvyruoja vieną kartą. Pvz., <a class=\"wl\" href=\"#spyruokline-svyruokle\">spyruoklinės svyruoklės<\/a> vežimėlis per tiek laiko nueina iš taško B į C ir grįžta į B.<\/p>\n<div class=\"mathd\">\\[T = \\frac{t}{N} \\qquad [T] = 1\\ \\text{s}\\]<\/div>\n<h2>Savasis svyravimo dažnis \\(\\nu\\)<\/h2>\n<p>Svyravimų skaičius per vieną sekundę.<\/p>\n<div class=\"mathd\">\\[\\nu = \\frac{N}{t} \\qquad [\\nu] = 1\\ \\text{Hz} = 1\\ \\text{s}^{-1}\\]<\/div>\n<ul>\n<li>1 Hz: per 1 s kūnas susvyruoja vieną kartą<\/li>\n<li>\\(1\\ \\text{kHz} = 10^3\\ \\text{Hz}\\), \\(1\\ \\text{MHz} = 10^6\\ \\text{Hz}\\)<\/li>\n<\/ul>\n<aside class=\"co co-note\"><p class=\"co-k\">Pastaba<\/p><p class=\"co-t\">Žymėjimas<\/p><div class=\"co-b\"><p>Vadovėlyje dažnis žymimas \\(\\nu\\) (niu), o pamokoje \\(f\\). Abu reiškia tą patį.<\/p><\/div><\/aside>\n\n<h2>Ryšys (vadovėlio 8.1 formulė)<\/h2>\n<div class=\"mathd\">\\[\\nu = \\frac{1}{T} \\qquad T = \\frac{1}{\\nu}\\]<\/div>\n<ul>\n<li>\\(t\\): laikas, \\(N\\): svyravimų skaičius<\/li>\n<li>Toliau: <a class=\"wl\" href=\"#ciklinis-daznis\">Ciklinis dažnis<\/a> \\(\\omega = 2\\pi\\nu\\)<\/li>\n<\/ul>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\(T = 10\\) s. Koks dažnis?<\/span><\/summary><div class=\"co-b\"><p>\\(\\nu = \\frac{1}{10} = 0{,}1\\) Hz.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\(T = 0{,}05\\) s. Koks dažnis?<\/span><\/summary><div class=\"co-b\"><p>\\(\\nu = \\frac{1}{0{,}05} = 20\\) Hz (žr. <a class=\"wl\" href=\"#uzdavinys-1-svyruokle-t-0-05-s\">Uždavinys 1 – svyruoklė (T = 0,05 s)<\/a>).<\/p><\/div><\/details>\n\n<p>Daugiau: <a class=\"wl\" href=\"#vadovelio-uzdaviniai-8-1-8-2\">Vadovėlio uždaviniai (8.1–8.2)<\/a> (5 ir 6 uždaviniai).<\/p>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["ciklinis-daznis", "mechaniniai-svyravimai", "spyruokline-svyruokle", "uzdavinys-1-svyruokle-t-0-05-s", "vadovelio-uzdaviniai-8-1-8-2"], "q": 2}, {"id": "ciklinis-daznis", "name": "Ciklinis dažnis", "title": "Ciklinis dažnis \\(\\omega\\)", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>.<\/p>\n<div class=\"mathd\">\\[\\omega = \\frac{\\varphi}{t} = \\frac{2\\pi}{T} = 2\\pi f \\qquad [\\omega] = \\frac{\\text{rad}}{\\text{s}}\\]<\/div>\n<ul>\n<li>\\(\\varphi\\): fazė (kampas radianais)<\/li>\n<li>\\(T\\), \\(f\\): žr. <a class=\"wl\" href=\"#periodas-ir-daznis\">Periodas ir dažnis<\/a><\/li>\n<\/ul>\n<p>Per vieną periodą fazė pasikeičia \\(2\\pi\\) radianų, todėl \\(\\omega = \\frac{2\\pi}{T}\\).<\/p>\n<p>\\(\\omega\\) naudojamas <a class=\"wl\" href=\"#judejimo-lygtis\">judėjimo lygtyje<\/a>: \\(x = x_m \\cos \\omega t\\).<\/p>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\(f = 20\\) Hz. Koks \\(\\omega\\)?<\/span><\/summary><div class=\"co-b\"><p>\\(\\omega = 2\\pi \\cdot 20 \\approx 125{,}66\\) rad/s.<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["judejimo-lygtis", "mechaniniai-svyravimai", "periodas-ir-daznis"], "q": 1}, {"id": "harmoninis-svyravimas", "name": "Harmoninis svyravimas", "title": "Harmoninis svyravimas", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.2.<\/p>\n<h2>Apibrėžimas<\/h2>\n<p><strong>Harmoninis svyravimas<\/strong>: fizikinis dydis laikui bėgant kinta periodiškai pagal <strong>sinuso arba kosinuso dėsnį<\/strong>.<\/p>\n<p>Jis vaizduojamas sinusoide arba kosinusoide.<\/p>\n<h2>Geometrinis modelis: judėjimas apskritimu<\/h2>\n<p>Prie sukamojo stalelio krašto pritvirtintas rutuliukas, o lempa meta jo šešėlį ant ekrano.\n- Rutuliukas juda <strong>apskritimu<\/strong> (vis į tą pačią pusę).\n- Jo <strong>šešėlis<\/strong> (projekcija) juda <strong>pirmyn ir atgal<\/strong>, kaip svyruoklė.<\/p>\n<p>Abu judesiai yra periodiniai, juos apibūdina tie patys dydžiai: <a class=\"wl\" href=\"#amplitude\">Amplitudė<\/a>, <a class=\"wl\" href=\"#periodas-ir-daznis\">periodas, dažnis<\/a>.<\/p>\n<p>Iš trikampio: šešėlio nuokrypis \\(x = x_m \\sin\\varphi\\), kur \\(\\varphi = \\omega t\\) (<a class=\"wl\" href=\"#svyravimo-faze\">Svyravimo fazė<\/a>). Taip gaunama <a class=\"wl\" href=\"#judejimo-lygtis\">Judėjimo lygtis<\/a>:<\/p>\n<div class=\"mathd\">\\[x = x_m \\sin\\left(\\frac{2\\pi}{T}t\\right)\\]<\/div>\n<p>Šešėlio greitis didžiausias centre ir lygus 0 kraštuose, kai rutuliuko greitis statmenas ekranui.<\/p>\n<h2>Grafinis vaizdavimas<\/h2>\n<p>Smėlio piltuvėlis svyruoja virš popieriaus lapo, o lapas tolygiai traukiamas į šoną. Smėlis nubrėžia <strong>sinusoidę<\/strong>, vadinasi, svyravimas harmoninis.\n- Atstumas nuo smėlio takelio iki vidurio linijos \\(OO_1\\) yra nuokrypis \\(x\\).\n- Didžiausias nuokrypis yra amplitudė \\(x_m\\).\n- Takelis kerta vidurio liniją kas <strong>pusę periodo<\/strong>.<\/p>\n<p>Kur naudojama: mašinų ir pastatų projektavimas, akustika, medicina (<strong>kardiograma<\/strong> yra grafinis širdies pulsavimo užrašas).<\/p>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: koks svyravimas vadinamas harmoniniu?<\/span><\/summary><div class=\"co-b\"><p>Kai dydis periodiškai kinta pagal sinuso arba kosinuso dėsnį.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kas bendra judėjimui apskritimu ir svyravimui?<\/span><\/summary><div class=\"co-b\"><p>Abu yra periodiniai judesiai, apibūdinami tais pačiais dydžiais (amplitude, periodu, dažniu). Apskritimu judančio kūno projekcija svyruoja harmoningai.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kaip dažnai smėlio takelis kerta liniją \\(OO_1\\)?<\/span><\/summary><div class=\"co-b\"><p>Kas pusę periodo.<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["amplitude", "judejimo-lygtis", "mechaniniai-svyravimai", "periodas-ir-daznis", "svyravimo-faze"], "q": 3}, {"id": "svyravimo-faze", "name": "Svyravimo fazė", "title": "Svyravimo fazė \\(\\varphi\\)", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.3.<\/p>\n<p>Fazė yra <a class=\"wl\" href=\"#harmoninis-svyravimas\">harmoninio svyravimo<\/a> funkcijos argumentas (tai, kas parašyta po \\(\\sin\\) ar \\(\\cos\\)):<\/p>\n<div class=\"mathd\">\\[\\varphi = \\omega t = \\frac{2\\pi}{T}t \\qquad [\\varphi] = \\text{rad}\\]<\/div>\n<p>Nuo fazės priklauso, <strong>kur yra kūnas<\/strong> (koordinatė) ir <strong>į kurią pusę jis juda<\/strong> tam tikru laiko momentu.<\/p>\n<p>Geometriniame modelyje fazė yra kampas, kuriuo rutuliukas pasisuko apskritimu per laiką \\(t\\).<\/p>\n<ul>\n<li>Per vieną periodą fazė padidėja \\(2\\pi\\).<\/li>\n<li>Susiję: <a class=\"wl\" href=\"#ciklinis-daznis\">Ciklinis dažnis<\/a>, <a class=\"wl\" href=\"#judejimo-lygtis\">Judėjimo lygtis<\/a><\/li>\n<\/ul>\n<aside class=\"co co-info\"><p class=\"co-k\">Papildyta<\/p><p class=\"co-t\">Atsiųsti puslapiai baigiasi 8.3 skyriaus pradžioje<\/p><div class=\"co-b\"><p>Atsiųsk likusius 8.3 puslapius, ir papildysiu šį užrašą.<\/p><\/div><\/aside>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\(T = 4\\) s. Kokia fazė, kai \\(t = 1\\) s?<\/span><\/summary><div class=\"co-b\"><p>\\(\\varphi = \\frac{2\\pi}{4}\\cdot 1 = \\frac{\\pi}{2}\\) rad. Kai \\(x = x_m\\sin\\varphi\\), kūnas tuo momentu yra kraštinėje padėtyje \\(x = x_m\\).<\/p><\/div><\/details>", "group": "savokos", "folder": "Mechaniniai svyravimai", "links": ["ciklinis-daznis", "harmoninis-svyravimas", "judejimo-lygtis", "mechaniniai-svyravimai"], "q": 1}, {"id": "spyruokline-svyruokle", "name": "Spyruoklinė svyruoklė", "title": "Spyruoklinė svyruoklė", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.1. Tai <a class=\"wl\" href=\"#laisvasis-ir-priverstinis-svyravimas\">laisvojo svyravimo<\/a> pavyzdys.<\/p>\n<p>Vežimėlis (arba krovinys), pritvirtintas prie plieninės spyruoklės, kurios kitas galas pritvirtintas prie stovo.<\/p>\n<h2>Jėgos<\/h2>\n<ul>\n<li>Spyruoklė nedeformuota (padėtis \\(OO_1\\)): tamprumo jėga \\(\\vec{F_t}\\) neveikia, o \\(\\vec{F_s}\\) ir \\(\\vec{N}\\) kompensuoja viena kitą. Atstojamoji lygi 0, tai <a class=\"wl\" href=\"#pusiausvyros-padetis\">pusiausvyros padėtis<\/a>.<\/li>\n<li>Patraukus į dešinę (taškas B), spyruoklė išsitempia, ir \\(\\vec{F_t}\\) stengiasi grąžinti vežimėlį į pusiausvyrą.<\/li>\n<\/ul>\n<h2>Vienas ciklas: B → C → B<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Vežimėlio judėjimas<\/th>\n<th>Tamprumo jėga<\/th>\n<th>Greitis<\/th>\n<th>Pagreitis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nuo B iki pusiausvyros<\/td>\n<td>mažėja<\/td>\n<td>didėja<\/td>\n<td>mažėja<\/td>\n<\/tr>\n<tr>\n<td>Nuo pusiausvyros iki C<\/td>\n<td>didėja<\/td>\n<td>mažėja<\/td>\n<td>didėja (priešingas greičiui)<\/td>\n<\/tr>\n<tr>\n<td>Nuo C iki pusiausvyros<\/td>\n<td>mažėja<\/td>\n<td>didėja<\/td>\n<td>mažėja<\/td>\n<\/tr>\n<tr>\n<td>Nuo pusiausvyros iki B<\/td>\n<td>didėja<\/td>\n<td>mažėja<\/td>\n<td>didėja (priešingas greičiui)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Pusiausvyroje: \\(F_t = 0\\), \\(a = 0\\), \\(v\\) <strong>didžiausias<\/strong>. Taškuose B ir C: \\(v = 0\\), \\(F_t\\) ir \\(a\\) <strong>didžiausi<\/strong>.<\/p>\n<aside class=\"co co-note\"><p class=\"co-k\">Pastaba<\/p><p class=\"co-t\">Tai vadovėlio 8.1 4-o uždavinio lentelė<\/p><div class=\"co-b\"><p>Pabandyk ją užpildyti pats, o tada pasitikrink čia.<\/p><\/div><\/aside>\n\n<h2>Svyravimo priežastis<\/h2>\n<p><strong>Tamprumo jėga<\/strong>, veikianti kūną pusiausvyros padėties kryptimi, ir <strong>kūno inercija<\/strong> (žr. <a class=\"wl\" href=\"#laisvojo-svyravimo-salygos\">Laisvojo svyravimo sąlygos<\/a>).<\/p>\n<p>Taip svyruoja mašinų dalys, statybinės sijos, lingės, garso virpesiai.<\/p>\n<aside class=\"co co-info\"><p class=\"co-k\">Papildyta<\/p><p class=\"co-t\">Papildyta<\/p><div class=\"co-b\"><p>Periodo formulės atsiųstuose puslapiuose nėra:\n<div class=\"mathd\">\\[T = 2\\pi\\sqrt{\\frac{m}{k}}\\]<\/div>\n\\(k\\): spyruoklės standumas (N/m). Čia periodas <strong>priklauso<\/strong> nuo masės, kitaip nei <a class=\"wl\" href=\"#matematine-svyruokle\">matematinės svyruoklės<\/a>.<\/p><\/div><\/aside>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kokia spyruoklinės svyruoklės svyravimo priežastis?<\/span><\/summary><div class=\"co-b\"><p>Tamprumo jėga, nukreipta į pusiausvyros padėtį, ir kūno inercija.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kur vežimėlio pagreitis lygus nuliui?<\/span><\/summary><div class=\"co-b\"><p>Pusiausvyros padėtyje, nes ten tamprumo jėga lygi 0.<\/p><\/div><\/details>", "group": "svyruokles", "folder": "Mechaniniai svyravimai", "links": ["laisvasis-ir-priverstinis-svyravimas", "laisvojo-svyravimo-salygos", "matematine-svyruokle", "mechaniniai-svyravimai", "pusiausvyros-padetis"], "q": 2}, {"id": "matematine-svyruokle", "name": "Matematinė svyruoklė", "title": "Matematinė svyruoklė", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.1. Tai <a class=\"wl\" href=\"#laisvasis-ir-priverstinis-svyravimas\">laisvojo svyravimo<\/a> pavyzdys.<\/p>\n<h2>Apibrėžimas<\/h2>\n<p><strong>Matematinė svyruoklė<\/strong> yra idealizuota sistema: mažas kūnas kabo ant ilgo siūlo, kuris netempiamas ir beveik nieko nesveria, palyginti su kūnu.<\/p>\n<p>Tai <strong>modelis<\/strong>: rutuliuką laikome materialiuoju tašku, o siūlo pailgėjimo ir masės nepaisome.<\/p>\n<h2>Sąlygos (iš pamokos)<\/h2>\n<p>a) Siūlo ilgis daug didesnis už kūno matmenis.\nb) Siūlas netąsus.\nc) \\(m_k \\gg m_s\\): kūno masė daug didesnė už siūlo masę.\nd) \\(x_m \\ll l\\): <a class=\"wl\" href=\"#amplitude\">Amplitudė<\/a> daug mažesnė už siūlo ilgį.<\/p>\n<h2>Jėgos<\/h2>\n<ul>\n<li>\\(\\vec{F_s} = m\\vec{g}\\): sunkio jėga<\/li>\n<li>\\(\\vec{F_t}\\): siūlo tamprumo jėga (pamokoje \\(\\vec{F_T}\\))<\/li>\n<\/ul>\n<p><strong>Pusiausvyroje<\/strong> (padėtis \\(OO_1\\), žr. <a class=\"wl\" href=\"#pusiausvyros-padetis\">Pusiausvyros padėtis<\/a>): \\(\\vec{F_s} + \\vec{F_t} = 0\\)<\/p>\n<p><strong>Atlenkta<\/strong> (taškas B): jėgos sudaro bukąjį kampą ir nebesikompensuoja. Jų atstojamoji \\(\\vec{F}\\) nukreipta (liestine) <strong>į pusiausvyros padėtį<\/strong>.<\/p>\n<h2>Vienas svyravimo ciklas<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Judėjimas<\/th>\n<th>Jėga \\(F\\)<\/th>\n<th>Greitis \\(v\\)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>B → pusiausvyra<\/td>\n<td>mažėja, pusiausvyroje lygi 0<\/td>\n<td>didėja (didžiausias pusiausvyroje)<\/td>\n<\/tr>\n<tr>\n<td>pusiausvyra → C<\/td>\n<td>didėja, nukreipta prieš judėjimą<\/td>\n<td>mažėja, taške C lygus 0<\/td>\n<\/tr>\n<tr>\n<td>C → pusiausvyra → B<\/td>\n<td>kartojasi į kitą pusę<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Pamokoje: \\(v_{1\\to3}\\) <strong>didėja<\/strong>, \\(F_{1\\to3}\\) <strong>mažėja<\/strong>, \\(a\\) <strong>kinta<\/strong>.<\/p>\n<h2>Svyravimo priežastis<\/h2>\n<p><strong>Atstojamoji jėga, nukreipta į pusiausvyros padėtį<\/strong>, ir <strong>svyruoklės inercija<\/strong> (žr. <a class=\"wl\" href=\"#laisvojo-svyravimo-salygos\">Laisvojo svyravimo sąlygos<\/a>).<\/p>\n<h2>Periodas<\/h2>\n<aside class=\"co co-info\"><p class=\"co-k\">Papildyta<\/p><p class=\"co-t\">Papildyta<\/p><div class=\"co-b\"><p>Šios formulės nėra nei užrašuose, nei atsiųstuose puslapiuose, bet ji šios temos pagrindinė.<\/p>\n<div class=\"mathd\">\\[T = 2\\pi\\sqrt{\\frac{l}{g}}\\]<\/div>\n<p>Periodas nepriklauso nuo masės, tik nuo siūlo ilgio \\(l\\) ir \\(g\\).<\/p><\/div><\/aside>\n\n<h2>Susiję<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#spyruokline-svyruokle\">Spyruoklinė svyruoklė<\/a><\/li>\n<li><a class=\"wl\" href=\"#judejimo-lygtis\">Judėjimo lygtis<\/a><\/li>\n<li><a class=\"wl\" href=\"#uzdavinys-1-svyruokle-t-0-05-s\">Uždavinys 1 – svyruoklė (T = 0,05 s)<\/a><\/li>\n<\/ul>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kas yra matematinė svyruoklė?<\/span><\/summary><div class=\"co-b\"><p>Idealizuota sistema: mažas kūnas ant ilgo, netąsaus ir labai lengvo siūlo.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kas grąžina rutuliuką į pusiausvyrą?<\/span><\/summary><div class=\"co-b\"><p>Sunkio ir tamprumo jėgų atstojamoji \\(\\vec{F}\\), nukreipta į pusiausvyros padėtį.<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: siūlą pailginus 4 kartus, kaip pasikeis periodas?<\/span><\/summary><div class=\"co-b\"><p>Padidės 2 kartus, nes \\(T \\sim \\sqrt{l}\\).<\/p><\/div><\/details>", "group": "svyruokles", "folder": "Mechaniniai svyravimai", "links": ["amplitude", "judejimo-lygtis", "laisvasis-ir-priverstinis-svyravimas", "laisvojo-svyravimo-salygos", "mechaniniai-svyravimai", "pusiausvyros-padetis", "spyruokline-svyruokle", "uzdavinys-1-svyruokle-t-0-05-s"], "q": 3}, {"id": "judejimo-lygtis", "name": "Judėjimo lygtis", "title": "Judėjimo (svyravimo) lygtis \\(x = x(t)\\)", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.2.\nLygčių grandinė: <strong>Judėjimo<\/strong> → <a class=\"wl\" href=\"#greicio-lygtis\">Greičio<\/a> → <a class=\"wl\" href=\"#pagreicio-lygtis\">Pagreičio<\/a> → <a class=\"wl\" href=\"#jegos-lygtis\">Jėgos<\/a>.<\/p>\n<p>Pagrindinis mechanikos uždavinys yra nustatyti kūno padėtį bet kuriuo laiko momentu. Svyruojančiam kūnui tai padaro ši lygtis (vadovėlio 8.4 formulė):<\/p>\n<div class=\"mathd\">\\[x = x_m \\sin\\varphi = x_m \\sin(\\omega t) = x_m \\sin\\left(\\frac{2\\pi}{T}t\\right)\\]<\/div>\n<ul>\n<li>\\(x_m\\): <a class=\"wl\" href=\"#amplitude\">Amplitudė<\/a><\/li>\n<li>\\(\\omega = 2\\pi\\nu\\): <a class=\"wl\" href=\"#ciklinis-daznis\">Ciklinis dažnis<\/a><\/li>\n<li>\\(\\varphi = \\omega t\\): <a class=\"wl\" href=\"#svyravimo-faze\">Svyravimo fazė<\/a><\/li>\n<\/ul>\n<p>Ji išvedama iš <a class=\"wl\" href=\"#harmoninis-svyravimas\">geometrinio modelio<\/a>.<\/p>\n<h2>Kurią formą rinktis? Žiūrėk, kur kūnas yra, kai \\(t = 0\\)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Kai \\(t = 0\\)<\/th>\n<th>Lygtis<\/th>\n<th>Grafikas prasideda<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\\(x = 0\\), juda \\(+x\\) kryptimi<\/td>\n<td>\\(x = x_m \\sin \\omega t\\)<\/td>\n<td>nuo 0, kyla aukštyn<\/td>\n<\/tr>\n<tr>\n<td>\\(x = 0\\), juda \\(-x\\) kryptimi<\/td>\n<td>\\(x = -x_m \\sin \\omega t\\)<\/td>\n<td>nuo 0, leidžiasi žemyn<\/td>\n<\/tr>\n<tr>\n<td>\\(x = x_m\\) (dešinysis kraštas)<\/td>\n<td>\\(x = x_m \\cos \\omega t\\)<\/td>\n<td>nuo viršaus<\/td>\n<\/tr>\n<tr>\n<td>\\(x = -x_m\\) (kairysis kraštas)<\/td>\n<td>\\(x = -x_m \\cos \\omega t\\)<\/td>\n<td>nuo apačios<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Grafikai<\/h2>\n<p>Kai \\(x = x_m \\cos \\omega t\\), greitis \\(v = -x_m\\omega \\sin \\omega t\\): grafikas prasideda nuo 0 ir <strong>pirmiausia leidžiasi žemyn<\/strong> (žr. <a class=\"wl\" href=\"#greicio-lygtis\">Greičio lygtis<\/a>).<\/p>\n<aside class=\"co co-warning\"><p class=\"co-k\">Patikrink<\/p><p class=\"co-t\">Patikrink savo užrašus<\/p><div class=\"co-b\"><p>1-o lapo apačioje šalia \\(x\\) (cos) grafiko nupieštas \\(v\\) grafikas. Jei \\(x = x_m\\cos\\omega t\\), tai \\(v\\) iš 0 turi eiti <strong>žemyn<\/strong> (−sin). Nuotraukoje sunku įžiūrėti, todėl verta pasitikrinti.<\/p><\/div><\/aside>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kai \\(t=0\\), kūnas yra kairiajame krašte. Kokia lygtis?<\/span><\/summary><div class=\"co-b\"><p>\\(x = -x_m \\cos \\omega t\\)<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: amplitudė 20 cm, dažnis 0,25 Hz, \\(t=0\\) kūnas pusiausvyroje juda \\(+x\\) kryptimi. Užrašyk \\(x(t)\\).<\/span><\/summary><div class=\"co-b\"><p>\\(\\omega = 2\\pi \\cdot 0{,}25 = 0{,}5\\pi\\) rad/s, todėl \\(x = 0{,}2\\sin(0{,}5\\pi t)\\) (m).<\/p><\/div><\/details>\n\n<p>Daugiau: <a class=\"wl\" href=\"#vadovelio-uzdaviniai-8-1-8-2\">Vadovėlio uždaviniai (8.1–8.2)<\/a>.<\/p>", "group": "lygtys", "folder": "Mechaniniai svyravimai", "links": ["amplitude", "ciklinis-daznis", "greicio-lygtis", "harmoninis-svyravimas", "jegos-lygtis", "mechaniniai-svyravimai", "pagreicio-lygtis", "svyravimo-faze", "vadovelio-uzdaviniai-8-1-8-2"], "q": 2}, {"id": "greicio-lygtis", "name": "Greičio lygtis", "title": "Greičio lygtis \\(v = x&#x27;\\)", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Gaunama iš <a class=\"wl\" href=\"#judejimo-lygtis\">judėjimo lygties<\/a> imant <a class=\"wl\" href=\"#isvestine\">išvestinę<\/a>.<\/p>\n<div class=\"mathd\">\\[v = x&#x27;(t)\\]<\/div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Jei<\/th>\n<th>Tai<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\\(x = x_m \\sin \\omega t\\)<\/td>\n<td>\\(v = x_m \\omega \\cos \\omega t\\)<\/td>\n<\/tr>\n<tr>\n<td>\\(x = x_m \\cos \\omega t\\)<\/td>\n<td>\\(v = -x_m \\omega \\sin \\omega t\\)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Greičio amplitudė:<\/strong>\n<div class=\"mathd\">\\[v_m = x_m \\omega\\]<\/div>\n<p>Greitis didžiausias <a class=\"wl\" href=\"#pusiausvyros-padetis\">pusiausvyros padėtyje<\/a>, o kraštuose lygus 0.<\/p>\n<p>Pavyzdys: <a class=\"wl\" href=\"#uzdavinys-1-svyruokle-t-0-05-s\">Uždavinys 1 – svyruoklė (T = 0,05 s)<\/a>, kuriame \\(v = 12{,}57 \\cos(125{,}66\\,t)\\).<\/p>\n<p>Toliau: <a class=\"wl\" href=\"#pagreicio-lygtis\">Pagreičio lygtis<\/a>.<\/p>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\(x = 0{,}05 \\cos(4t)\\). Užrašyk \\(v(t)\\) ir \\(v_m\\).<\/span><\/summary><div class=\"co-b\"><p>\\(v = -0{,}2 \\sin(4t)\\), \\(v_m = 0{,}2\\) m/s.<\/p><\/div><\/details>", "group": "lygtys", "folder": "Mechaniniai svyravimai", "links": ["isvestine", "judejimo-lygtis", "mechaniniai-svyravimai", "pagreicio-lygtis", "pusiausvyros-padetis", "uzdavinys-1-svyruokle-t-0-05-s"], "q": 1}, {"id": "pagreicio-lygtis", "name": "Pagreičio lygtis", "title": "Pagreičio lygtis \\(a = v&#x27;\\)", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Vadovėlis 8.3.<\/p>\n<aside class=\"co co-info\"><p class=\"co-k\">Papildyta<\/p><p class=\"co-t\">Papildyta<\/p><div class=\"co-b\"><p>Užrašuose buvo tik antraštė „Pagreičio lygtis“, o vadovėlio 8.3 dalis nebuvo atsiųsta. Turinį papildžiau; pasitikrink su vadovėliu ar mokytojo užrašais.<\/p><\/div><\/aside>\n\n<p>Gaunama iš <a class=\"wl\" href=\"#greicio-lygtis\">greičio lygties<\/a> imant <a class=\"wl\" href=\"#isvestine\">išvestinę<\/a>:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Jei<\/th>\n<th>Tai<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\\(x = x_m \\sin \\omega t\\)<\/td>\n<td>\\(a = -x_m \\omega^2 \\sin \\omega t\\)<\/td>\n<\/tr>\n<tr>\n<td>\\(x = x_m \\cos \\omega t\\)<\/td>\n<td>\\(a = -x_m \\omega^2 \\cos \\omega t\\)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Abiem atvejais:\n<div class=\"mathd\">\\[a = -\\omega^2 x\\]<\/div>\n<p>Minuso ženklas reiškia, kad pagreitis <strong>visada nukreiptas priešingai poslinkiui<\/strong>, t. y. į <a class=\"wl\" href=\"#pusiausvyros-padetis\">pusiausvyros padėtį<\/a>.<\/p>\n<p><strong>Pagreičio amplitudė:<\/strong> \\(a_m = x_m\\omega^2\\) (kraštinėse padėtyse).<\/p>\n<p>Toliau: <a class=\"wl\" href=\"#jegos-lygtis\">Jėgos lygtis<\/a>.<\/p>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\(x = 0{,}1\\sin(10t)\\). Koks \\(a_m\\)?<\/span><\/summary><div class=\"co-b\"><p>\\(a_m = 0{,}1 \\cdot 10^2 = 10\\) m/s².<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: kodėl \\(a = -\\omega^2 x\\) turi minusą?<\/span><\/summary><div class=\"co-b\"><p>Kai kūnas nukrypęs į \\(+x\\), pagreitis nukreiptas į \\(-x\\), t. y. atgal į pusiausvyrą.<\/p><\/div><\/details>", "group": "lygtys", "folder": "Mechaniniai svyravimai", "links": ["greicio-lygtis", "isvestine", "jegos-lygtis", "mechaniniai-svyravimai", "pusiausvyros-padetis"], "q": 2}, {"id": "jegos-lygtis", "name": "Jėgos lygtis", "title": "Jėgos lygtis \\(F = ma\\)", "html": "<p>Dalis temos <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>.<\/p>\n<aside class=\"co co-info\"><p class=\"co-k\">Papildyta<\/p><p class=\"co-t\">Papildyta<\/p><div class=\"co-b\"><p>Užrašuose buvo tik antraštė „Jėgos lygtis“, todėl turinį papildžiau.<\/p><\/div><\/aside>\n\n<p>Pagal antrąjį Niutono dėsnį ir <a class=\"wl\" href=\"#pagreicio-lygtis\">pagreičio lygtį<\/a>:<\/p>\n<div class=\"mathd\">\\[F = ma = -m\\omega^2 x\\]<\/div>\n<ul>\n<li>Jėga proporcinga nuokrypiui \\(x\\) ir nukreipta priešingai jam, t. y. į <a class=\"wl\" href=\"#pusiausvyros-padetis\">pusiausvyros padėtį<\/a>. Tai ta pati grąžinanti jėga iš <a class=\"wl\" href=\"#laisvojo-svyravimo-salygos\">laisvojo svyravimo sąlygų<\/a>.<\/li>\n<li><strong>Didžiausia jėga:<\/strong> \\(F_m = m x_m \\omega^2\\) (kraštinėse padėtyse)<\/li>\n<li>Pusiausvyroje \\(F = 0\\).<\/li>\n<\/ul>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\(m = 5\\) kg, \\(x_m = 0{,}1\\) m, \\(\\omega = 125{,}66\\) rad/s. Koks \\(F_m\\)?<\/span><\/summary><div class=\"co-b\"><p>\\(F_m = 5 \\cdot 0{,}1 \\cdot 125{,}66^2 \\approx 7896\\) N (žr. <a class=\"wl\" href=\"#uzdavinys-1-svyruokle-t-0-05-s\">Uždavinys 1 – svyruoklė (T = 0,05 s)<\/a>).<\/p><\/div><\/details>", "group": "lygtys", "folder": "Mechaniniai svyravimai", "links": ["laisvojo-svyravimo-salygos", "mechaniniai-svyravimai", "pagreicio-lygtis", "pusiausvyros-padetis", "uzdavinys-1-svyruokle-t-0-05-s"], "q": 1}, {"id": "uzdavinys-1-svyruokle-t-0-05-s", "name": "Uždavinys 1 – svyruoklė (T = 0,05 s)", "title": "Uždavinys 1: svyruoklė (\\(T = 0{,}05\\) s)", "html": "<p>Iš pamokos. Tema: <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>.<\/p>\n<h2>Duota<\/h2>\n<ul>\n<li>\\(m = 5\\) kg<\/li>\n<li>\\(T = 0{,}05\\) s<\/li>\n<li>\\(x_m = 0{,}1\\) m<\/li>\n<li>Kai \\(t = 0\\): \\(x = 0\\), kūnas juda į dešinę (\\(+x\\))<\/li>\n<\/ul>\n<h2>Sprendimas<\/h2>\n<p><strong>1. Lygties forma.<\/strong> Kūnas pradeda iš pusiausvyros ir juda \\(+x\\), todėl naudojam \\(\\sin\\) (žr. <a class=\"wl\" href=\"#judejimo-lygtis\">Judėjimo lygtis<\/a>):\n<div class=\"mathd\">\\[x = x_m \\sin 2\\pi f t\\]<\/div>\n<p><strong>2. Dažnis<\/strong> (<a class=\"wl\" href=\"#periodas-ir-daznis\">Periodas ir dažnis<\/a>):\n<div class=\"mathd\">\\[f = \\frac{1}{T} = \\frac{1}{0{,}05} = 20\\ \\text{Hz}\\]<\/div>\n<p><strong>3. Ciklinis dažnis<\/strong> (<a class=\"wl\" href=\"#ciklinis-daznis\">Ciklinis dažnis<\/a>):\n<div class=\"mathd\">\\[\\omega = 2\\pi f = 2\\pi \\cdot 20 \\approx 125{,}66\\ \\text{rad/s}\\]<\/div>\n<p><strong>4. Judėjimo lygtis:<\/strong>\n<div class=\"mathd\">\\[x = 0{,}1 \\sin(125{,}66\\,t)\\]<\/div>\n<p><strong>5. Greičio lygtis<\/strong> (<a class=\"wl\" href=\"#greicio-lygtis\">Greičio lygtis<\/a>, <a class=\"wl\" href=\"#isvestine\">Išvestinė<\/a>):\n<div class=\"mathd\">\\[v = x&#x27; = 0{,}1 \\cdot 125{,}66 \\cos(125{,}66\\,t) \\approx 12{,}57 \\cos(125{,}66\\,t)\\]<\/div>\n<aside class=\"co co-note\"><p class=\"co-k\">Pastaba<\/p><p class=\"co-t\">Apvalinimas<\/p><div class=\"co-b\"><p>Užrašuose parašyta 12,56. Tiksliau \\(0{,}1 \\cdot 125{,}66 = 12{,}566 \\approx 12{,}57\\) m/s. Skirtumas mažas, bet kontroliniame verta apvalinti teisingai.<\/p><\/div><\/aside>\n\n<h2>Grafikas<\/h2>\n<p>\\(x(t)\\) yra sinusoidė: prasideda nuo 0, kyla iki 0,1 m, o vienas pilnas svyravimas trunka 0,05 s.<\/p>\n<h2>Papildomai (pabandyk pats)<\/h2>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Kokia didžiausia pagreičio vertė?<\/span><\/summary><div class=\"co-b\"><p>\\(a_m = x_m\\omega^2 = 0{,}1 \\cdot 125{,}66^2 \\approx 1579\\) m/s² (žr. <a class=\"wl\" href=\"#pagreicio-lygtis\">Pagreičio lygtis<\/a>).<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Kokia didžiausia jėga?<\/span><\/summary><div class=\"co-b\"><p>\\(F_m = m a_m = 5 \\cdot 1579 \\approx 7896\\) N (žr. <a class=\"wl\" href=\"#jegos-lygtis\">Jėgos lygtis<\/a>).<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Kokia būtų lygtis, jei kai \\(t = 0\\) kūnas būtų dešiniajame krašte?<\/span><\/summary><div class=\"co-b\"><p>\\(x = 0{,}1\\cos(125{,}66\\,t)\\)<\/p><\/div><\/details>", "group": "uzdaviniai", "folder": "Mechaniniai svyravimai", "links": ["ciklinis-daznis", "greicio-lygtis", "isvestine", "jegos-lygtis", "judejimo-lygtis", "mechaniniai-svyravimai", "pagreicio-lygtis", "periodas-ir-daznis"], "q": 3}, {"id": "vadovelio-uzdaviniai-8-1-8-2", "name": "Vadovėlio uždaviniai (8.1–8.2)", "title": "Vadovėlio uždaviniai (8.1–8.2)", "html": "<p>Tema: <a class=\"wl\" href=\"#mechaniniai-svyravimai\">Mechaniniai svyravimai<\/a>. Uždaviniai perrašyti savais žodžiais ir sutrumpinti, o pilnos sąlygos yra vadovėlyje (56 ir 61 psl.). Pirmiausia pabandyk pats, tada atsiversk atsakymą.<\/p>\n<h2>8.1 skyrius<\/h2>\n<p><strong>1.<\/strong> Ką vadiname mechaniniu, laisvuoju ir priverstiniu svyravimu? Pateik pavyzdžių.<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>Žr. <a class=\"wl\" href=\"#mechaninis-svyravimas\">Mechaninis svyravimas<\/a> ir <a class=\"wl\" href=\"#laisvasis-ir-priverstinis-svyravimas\">Laisvasis ir priverstinis svyravimas<\/a>.<\/p><\/div><\/details>\n\n<p><strong>2.<\/strong> Kokiomis sąlygomis kūnas gali svyruoti?<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>Žr. <a class=\"wl\" href=\"#laisvojo-svyravimo-salygos\">Laisvojo svyravimo sąlygos<\/a>: grąžinanti jėga, inercija, maža trintis.<\/p><\/div><\/details>\n\n<p><strong>3.<\/strong> Kas yra periodas ir kaip jį apskaičiuoti?<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>Laikas vienam svyravimui: \\(T = \\frac{t}{N}\\) arba \\(T = \\frac{1}{\\nu}\\). Žr. <a class=\"wl\" href=\"#periodas-ir-daznis\">Periodas ir dažnis<\/a>.<\/p><\/div><\/details>\n\n<p><strong>4.<\/strong> Užpildyk lentelę apie spyruoklinės svyruoklės vežimėlio jėgą, greitį ir pagreitį.<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>Žr. lentelę užraše <a class=\"wl\" href=\"#spyruokline-svyruokle\">Spyruoklinė svyruoklė<\/a>.<\/p><\/div><\/details>\n\n<p><strong>5.<\/strong> Vežimėlis per 8 s susvyruoja 32 kartus. Rask \\(T\\) ir \\(\\nu\\).<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas: 0,25 s; 4 Hz<\/span><\/summary><div class=\"co-b\"><p>\\(T = \\frac{8}{32} = 0{,}25\\) s, \\(\\nu = \\frac{1}{0{,}25} = 4\\) Hz.<\/p><\/div><\/details>\n\n<p><strong>6.<\/strong> Ratas per 6 min apsisuka 1440 kartų. Kokiu dažniu svyruoja stūmoklis?<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas: 4 Hz<\/span><\/summary><div class=\"co-b\"><p>\\(t = 6 \\cdot 60 = 360\\) s, \\(\\nu = \\frac{1440}{360} = 4\\) Hz. Nepamiršk minučių paversti sekundėmis!<\/p><\/div><\/details>\n\n<h2>8.2 skyrius<\/h2>\n<p><strong>1.<\/strong> Kaip sprendžiamas pagrindinis mechanikos uždavinys, kai kūnas laisvai svyruoja?<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>Padėtį bet kuriuo momentu randame iš svyravimo lygties \\(x = x_m\\sin\\left(\\frac{2\\pi}{T}t\\right)\\). Žr. <a class=\"wl\" href=\"#judejimo-lygtis\">Judėjimo lygtis<\/a>.<\/p><\/div><\/details>\n\n<p><strong>2.<\/strong> Kas bendra judėjimui apskritimu ir svyravimui?<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>Žr. <a class=\"wl\" href=\"#harmoninis-svyravimas\">Harmoninis svyravimas<\/a> (geometrinis modelis).<\/p><\/div><\/details>\n\n<p><strong>3.<\/strong> Koks svyravimas vadinamas harmoniniu?<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>Kai dydis kinta pagal sinuso ar kosinuso dėsnį. Žr. <a class=\"wl\" href=\"#harmoninis-svyravimas\">Harmoninis svyravimas<\/a>.<\/p><\/div><\/details>\n\n<p><strong>4.<\/strong> \\(x = 0{,}03\\cos(100\\pi t)\\) (cm, s). b) Kur kūnas po 0,01 s? c) Koks poslinkis po 0,1 s ir po 0,2 s?<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas: b) −0,03 cm; c) 0,03 cm; 0<\/span><\/summary><div class=\"co-b\"><p>b) \\(x = 0{,}03\\cos(\\pi) = -0{,}03\\) cm.\nc) \\(\\omega = 100\\pi\\), todėl \\(T = \\frac{2\\pi}{100\\pi} = 0{,}02\\) s. Per 0,1 s ir 0,2 s įvyksta sveikas svyravimų skaičius (5 ir 10), todėl kūnas abiem atvejais yra pradinėje padėtyje \\(x = 0{,}03\\) cm, o poslinkis nuo pradinės padėties lygus 0.<\/p><\/div><\/details>\n\n<p><strong>5.<\/strong> Amplitudė 20 cm, dažnis 0,25 Hz. Užrašyk \\(x(t)\\).<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>\\(\\omega = 2\\pi \\cdot 0{,}25 = 0{,}5\\pi\\) rad/s, todėl \\(x = 0{,}2\\sin(0{,}5\\pi t)\\) (m). Periodas \\(T = 4\\) s.<\/p><\/div><\/details>\n\n<p><strong>6.<\/strong> Iš grafiko (8.2.4 pav.: sinusoidė, kertanti 0 ties 0, 4, 8, 12 s, viršūnės ties ±0,2 m): rask a) amplitudę, b) periodą, c) dažnį, d) kada greitis didžiausias ir kada lygus 0, e) kada rutuliukas juda į dešinę ir kada į kairę.<\/p>\n<details class=\"co co-success\"><summary><span class=\"co-t\">Atsakymas<\/span><\/summary><div class=\"co-b\"><p>a) \\(x_m = 0{,}2\\) m\nb) \\(T = 8\\) s\nc) \\(\\nu = \\frac{1}{8} = 0{,}125\\) Hz\nd) Greitis didžiausias, kai \\(x = 0\\): \\(t = 0, 4, 8, 12\\) s. Lygus 0 kraštuose: \\(t = 2, 6, 10, 14\\) s.\ne) Į dešinę (\\(x\\) didėja): 0–2 s, 6–10 s. Į kairę (\\(x\\) mažėja): 2–6 s, 10–14 s.<\/p><\/div><\/details>", "group": "uzdaviniai", "folder": "Mechaniniai svyravimai", "links": ["harmoninis-svyravimas", "judejimo-lygtis", "laisvasis-ir-priverstinis-svyravimas", "laisvojo-svyravimo-salygos", "mechaniniai-svyravimai", "mechaninis-svyravimas", "periodas-ir-daznis", "spyruokline-svyruokle"], "q": 12}, {"id": "isvestine", "name": "Išvestinė", "title": "Išvestinė", "html": "<p>Fizikoje naudojama <a class=\"wl\" href=\"#mechaniniai-svyravimai\">svyravimų<\/a> lygtims: \\(v = x&#x27;\\), \\(a = v&#x27;\\).<\/p>\n<div class=\"mathd\">\\[f&#x27;(x) = \\frac{df}{dx}\\]<\/div>\n<p>Išvestinė parodo, kaip greitai kinta funkcija. Todėl greitis yra koordinatės išvestinė pagal laiką.<\/p>\n<h2>Taisyklės (iš užrašų)<\/h2>\n<div class=\"mathd\">\\[(\\sin x)&#x27; = \\cos x \\qquad (\\cos x)&#x27; = -\\sin x\\]<\/div>\n<div class=\"mathd\">\\[(\\sin 2\\pi x)&#x27; = 2\\pi\\cos 2\\pi x \\qquad (\\cos 2\\pi x)&#x27; = -2\\pi \\sin 2\\pi x\\]<\/div>\n<p>Bendrai: \\((\\sin kx)&#x27; = k\\cos kx\\) ir \\((\\cos kx)&#x27; = -k\\sin kx\\).<\/p>\n<p><strong>Konstanta:<\/strong> \\((c)&#x27; = 0\\), todėl \\((c \\cdot f)&#x27; = c \\cdot f&#x27;\\). Pvz.:\n<div class=\"mathd\">\\[(0{,}1 \\sin 125{,}66t)&#x27; = 0{,}1 \\cdot 125{,}66 \\cos 125{,}66t\\]<\/div>\n<h2>Naudojama<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#greicio-lygtis\">Greičio lygtis<\/a><\/li>\n<li><a class=\"wl\" href=\"#pagreicio-lygtis\">Pagreičio lygtis<\/a><\/li>\n<li><a class=\"wl\" href=\"#uzdavinys-1-svyruokle-t-0-05-s\">Uždavinys 1 – svyruoklė (T = 0,05 s)<\/a><\/li>\n<\/ul>\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\((3\\cos 5t)&#x27; = ?\\)<\/span><\/summary><div class=\"co-b\"><p>\\(-15\\sin 5t\\)<\/p><\/div><\/details>\n\n<details class=\"co co-question\"><summary><span class=\"co-k\">Pasitikrink<\/span><span class=\"co-t\">Pasitikrink: \\((0{,}2\\sin \\pi t)&#x27; = ?\\)<\/span><\/summary><div class=\"co-b\"><p>\\(0{,}2\\pi\\cos \\pi t\\)<\/p><\/div><\/details>", "group": "matematika", "folder": "Matematika", "links": ["greicio-lygtis", "mechaniniai-svyravimai", "pagreicio-lygtis", "uzdavinys-1-svyruokle-t-0-05-s"], "q": 2}];
const GROUPS=[["apzvalga","Apžvalga"],["savokos","Sąvokos"],["svyruokles","Svyruoklės"],["lygtys","Lygtys"],["uzdaviniai","Uždaviniai"],["matematika","Matematika"]];
const GNAME=Object.fromEntries(GROUPS);
const byId=Object.fromEntries(NOTES.map(n=>[n.id,n]));
const back={};NOTES.forEach(n=>n.links.forEach(l=>{(back[l]=back[l]||[]).push(n.id)}));
const cvar=g=>`var(--g-${g})`;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NQ=NOTES.reduce((s,n)=>s+n.q,0);
const main=document.getElementById("main"),side=document.getElementById("side"),scrim=document.getElementById("scrim");
const phone=()=>matchMedia("(max-width:860px)").matches;
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
document.getElementById("stats").textContent=`${NOTES.length} ${pl(NOTES.length,["užrašas","užrašai","užrašų"])} · ${NQ} ${pl(NQ,["klausimas","klausimai","klausimų"])}`;

document.getElementById("nav").innerHTML=
  `<div class="grp"><ul><li><a class="item" href="#grafas" data-id="grafas"><span class="dot" style="--c:var(--sig)"></span>Žinių grafas</a></li></ul></div>`+
  GROUPS.map(([g,label])=>{const items=NOTES.filter(n=>n.group===g);if(!items.length)return"";
    return `<div class="grp"><h2>${label}</h2><ul>${items.map(n=>`<li><a class="item" href="#${n.id}" data-id="${n.id}"><span class="dot" style="--c:${cvar(n.group)}"></span>${esc(n.name)}</a></li>`).join("")}</ul></div>`}).join("");

const tabNotes=document.getElementById("tabNotes");
function setSheet(open){side.classList.toggle("open",open);scrim.classList.toggle("open",open);tabNotes.setAttribute("aria-expanded",open);tabNotes.classList.toggle("on",open);
  if(open){const c=side.querySelector('[aria-current="page"]');if(c)c.scrollIntoView({block:"center"})}}
tabNotes.onclick=()=>setSheet(!side.classList.contains("open"));
document.getElementById("closeSheet").onclick=()=>setSheet(false);
scrim.onclick=()=>setSheet(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")setSheet(false)});

function typeset(){if(window.__mj&&MathJax.typesetPromise){MathJax.typesetClear&&MathJax.typesetClear([main]);MathJax.typesetPromise([main]).catch(()=>{})}}

let sim=null;
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const n=byId[id];
  document.querySelectorAll(".item").forEach(a=>a.removeAttribute("aria-current"));
  const cur=document.querySelector(`.item[data-id="${n?n.id:"grafas"}"]`);if(cur)cur.setAttribute("aria-current","page");
  document.getElementById("graphBtn").classList.toggle("on",!n);
  document.getElementById("tabGraph").classList.toggle("on",!n);
  setSheet(false);
  if(sim){sim.stop();sim=null}
  if(n)renderNote(n);else renderHome();
  window.scrollTo({top:0});
}

function pl(q,f){return f[q%10===1&&q%100!==11?0:(q%10>=2&&q%10<=9&&(q%100<10||q%100>20)?1:2)]}
function plural(q){return pl(q,["klausimas","klausimai","klausimų"])}

function renderNote(n){
  const idx=NOTES.indexOf(n),prev=NOTES[idx-1],next=NOTES[idx+1];
  const bl=(back[n.id]||[]).map(i=>byId[i]);
  main.innerHTML=`<article class="note view">
    <p class="crumb mono"><span><span class="dot" style="--c:${cvar(n.group)}"></span>${GNAME[n.group]}</span><span>${String(idx+1).padStart(2,"0")} / ${NOTES.length}</span>${n.q?`<span>${n.q} ${plural(n.q)}</span>`:""}</p>
    <h1>${n.title}</h1>
    ${n.q>1?`<div class="tools"><button class="tbtn" type="button" id="openAll" aria-pressed="false">Rodyti visus atsakymus</button></div>`:""}
    <div class="body">${n.html}</div>
    ${bl.length?`<section class="back"><h2>Nuorodos į šį užrašą · ${bl.length}</h2><ul class="chips">${bl.map(b=>`<li><a href="#${b.id}"><span class="dot" style="--c:${cvar(b.group)}"></span>${esc(b.name)}</a></li>`).join("")}</ul></section>`:""}
    <nav class="pn" aria-label="Kitas ir ankstesnis užrašas">${prev?`<a href="#${prev.id}"><small>Ankstesnis</small>${esc(prev.name)}</a>`:""}${next?`<a class="nx" href="#${next.id}"><small>Kitas</small>${esc(next.name)}</a>`:""}</nav>
  </article>`;
  const ob=document.getElementById("openAll");
  if(ob)ob.onclick=()=>{const on=ob.getAttribute("aria-pressed")!=="true";ob.setAttribute("aria-pressed",on);ob.classList.toggle("on",on);ob.textContent=on?"Slėpti visus atsakymus":"Rodyti visus atsakymus";main.querySelectorAll("details.co").forEach(d=>d.open=on)};
  document.title=n.name+" · Svyravimų užrašai";
  typeset();
}

function renderHome(){
  main.innerHTML=`<section class="home view">
    <h1>Mechaniniai svyravimai</h1>
    <p class="lede">Visa tema viename žemėlapyje: ${NOTES.length} ${pl(NOTES.length,["susietas užrašas","susieti užrašai","susietų užrašų"])} iš pamokų ir vadovėlio 8.1–8.3 skyrių. Kiekvienas taškas yra užrašas, linija yra nuoroda.</p>
    <div class="screen" id="gw">
      <div class="readout mono"><span>Mazgai <b id="rN">0</b></span><span>Ryšiai <b id="rL">0</b></span><span class="rz">Mastelis <b id="rZ">1.0</b></span></div>
      <div class="zoomctl"><button class="tbtn" type="button" id="zIn" aria-label="Priartinti">+</button><button class="tbtn" type="button" id="zOut" aria-label="Nutolinti">−</button><button class="tbtn" type="button" id="zFit" aria-label="Rodyti visą grafą" style="width:auto;padding:0 10px">Visas</button></div>
      <div class="gcard" id="gcard" aria-live="polite"><div class="gc-t"><span class="gc-k mono" id="gcK"></span><span class="gc-n" id="gcN"></span></div><a class="open" id="gcOpen" href="#">Atidaryti</a></div>
    </div>
    <ul class="legend mono">${GROUPS.map(([g,l])=>`<li><span class="dot" style="--c:${cvar(g)}"></span>${l}</li>`).join("")}</ul>
    <p class="hint mono">${phone()?"Bakstelk tašką, kad pamatytum ryšius. Suspausk dviem pirštais, kad priartintum.":"Užvesk pelę, kad pamatytum ryšius. Spausk, kad atidarytum. Ratuku priartinsi, tempdamas pastumsi."}</p>
  </section>`;
  document.title="Svyravimų užrašai";
  if(window.d3)drawGraph(document.getElementById("gw"));
  else document.getElementById("gw").insertAdjacentHTML("beforeend",`<p style="padding:48px 16px">Grafas neįsikėlė. Užrašus rasi sąraše.</p>`);
}

function drawGraph(el){
  const W=el.clientWidth,H=el.clientHeight,small=W<620;
  const seen=new Set(),links=[];
  NOTES.forEach(n=>n.links.forEach(t=>{const k=[n.id,t].sort().join("|");if(!seen.has(k)&&byId[t]){seen.add(k);links.push({source:n.id,target:t})}}));
  const deg={};links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1;deg[l.target]=(deg[l.target]||0)+1});
  const nodes=NOTES.map(n=>({id:n.id,name:n.name,group:n.group,deg:deg[n.id]||0,r:3+Math.sqrt(deg[n.id]||1)*1.6}));
  const hubCut=[...nodes].sort((a,b)=>b.deg-a.deg)[5].deg;
  nodes.forEach(n=>n.hub=n.deg>=hubCut);
  document.getElementById("rN").textContent=nodes.length;document.getElementById("rL").textContent=links.length;

  sim=d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(d=>d.id).distance(95).strength(.25))
    .force("charge",d3.forceManyBody().strength(-620))
    .force("x",d3.forceX(0).strength(small?.16:.05)).force("y",d3.forceY(0).strength(small?.02:.08))
    .force("collide",d3.forceCollide(d=>d.r+26)).stop();
  for(let i=0;i<420;i++)sim.tick();

  const svg=d3.select(el).insert("svg",":first-child").attr("viewBox",[0,0,W,H]).attr("role","img").attr("aria-label","Užrašų ryšių grafas");
  const layer=svg.append("g");
  const lk=layer.append("g").selectAll("line").data(links).join("line").attr("class","lnk");
  const nd=layer.append("g").selectAll("g").data(nodes).join("g").attr("class",d=>"nd"+(d.hub?" hub":"")).attr("tabindex",0).attr("role","link").attr("aria-label",d=>d.name).style("--c",d=>cvar(d.group));
  nd.append("circle").attr("class","tgt").attr("r",small?20:14);
  nd.append("circle").attr("class","halo").attr("r",d=>d.r+6);
  nd.append("circle").attr("class","core").attr("r",d=>d.r);
  nd.append("circle").attr("class","pip").attr("r",d=>Math.max(1.4,d.r*.38));
  const label=nd.append("text").text(d=>d.name.length>28?d.name.slice(0,26)+"…":d.name).attr("y",4);

  let k=1;
  function place(){
    lk.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nd.attr("transform",d=>`translate(${d.x},${d.y})`);
  }
  function sizeLabels(){const fs=(small?10.5:11.5)/k;label.style("font-size",fs+"px").attr("x",d=>d.r+6/k).attr("y",fs*.36);
    svg.classed("far",k<(small?1.15:.85));document.getElementById("rZ").textContent=k.toFixed(1)}
  const zoom=d3.zoom().scaleExtent([.3,4]).on("zoom",e=>{layer.attr("transform",e.transform);k=e.transform.k;sizeLabels()});
  svg.call(zoom).on("dblclick.zoom",null);
  function fit(animate){
    const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
    const x0=Math.min(...xs)-20,x1=Math.max(...xs)+(small?70:120),y0=Math.min(...ys)-(small?56:36),y1=Math.max(...ys)+20;
    const s=Math.min(W/(x1-x0),(H-(small?70:40))/(y1-y0),1.6);
    const t=d3.zoomIdentity.translate(W/2-(x0+x1)/2*s,H/2-(y0+y1)/2*s-(small?14:0)).scale(s);
    (animate&&!RM?svg.transition().duration(320).ease(d3.easeCubicOut):svg).call(zoom.transform,t);
  }
  place();fit(false);
  document.getElementById("zIn").onclick=()=>svg.transition().duration(RM?0:200).call(zoom.scaleBy,1.4);
  document.getElementById("zOut").onclick=()=>svg.transition().duration(RM?0:200).call(zoom.scaleBy,1/1.4);
  document.getElementById("zFit").onclick=()=>fit(true);

  // entrance: rings in from the centre outward
  if(!RM){
    const dist=d=>Math.hypot(d.x,d.y);const maxD=d3.max(nodes,dist)||1;
    nd.style("opacity",0).transition().delay(d=>60+dist(d)/maxD*420).duration(260).ease(d3.easeCubicOut).style("opacity",1);
    lk.style("opacity",0).transition().delay(240).duration(420).style("opacity",1);
  }

  const nb=new Map(nodes.map(n=>[n.id,new Set([n.id])]));
  links.forEach(l=>{nb.get(l.source.id).add(l.target.id);nb.get(l.target.id).add(l.source.id)});
  const card=document.getElementById("gcard");
  let selected=null;
  function focus(d){
    svg.classed("focus",!!d);
    nd.classed("dim",n=>d&&!nb.get(d.id).has(n.id)).classed("near",n=>d&&n.id!==d.id&&nb.get(d.id).has(n.id)).classed("sel",n=>d&&n.id===d.id);
    lk.classed("hi",l=>d&&(l.source.id===d.id||l.target.id===d.id));
  }
  function select(d){selected=d;focus(d);
    if(d){document.getElementById("gcK").textContent=`${GNAME[d.group]} · ${d.deg} ${pl(d.deg,["ryšys","ryšiai","ryšių"])}`;document.getElementById("gcN").textContent=d.name;document.getElementById("gcOpen").href="#"+d.id}
    card.classList.toggle("show",!!d)}
  let lastType="mouse",moved=false;
  nd.on("pointerdown",e=>{lastType=e.pointerType;moved=false})
    .on("pointerenter",(e,d)=>{if(e.pointerType==="mouse"&&!selected)focus(d)})
    .on("pointerleave",e=>{if(e.pointerType==="mouse"&&!selected)focus(null)})
    .on("focus",(e,d)=>{if(!selected)focus(d)}).on("blur",()=>{if(!selected)focus(null)})
    .on("click",(e,d)=>{e.stopPropagation();if(moved)return;
      if(lastType==="mouse")location.hash=d.id;else select(d)})
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();location.hash=d.id}});
  svg.on("click",()=>{if(selected)select(null)});
  nd.call(d3.drag().clickDistance(4)
    .on("start",(e,d)=>{d.fx=d.x;d.fy=d.y;sim.on("tick",place).alphaTarget(.18).restart()})
    .on("drag",(e,d)=>{moved=true;d.fx=e.x;d.fy=e.y})
    .on("end",(e,d)=>{sim.alphaTarget(0);d.fx=null;d.fy=null}));
}

let rt,lastW=innerWidth;addEventListener("resize",()=>{if(innerWidth===lastW)return;lastW=innerWidth;
  if(!location.hash||location.hash==="#grafas"){clearTimeout(rt);rt=setTimeout(()=>{if(sim)sim.stop();renderHome()},200)}});
addEventListener("hashchange",route);
route();
</script>

</body>
